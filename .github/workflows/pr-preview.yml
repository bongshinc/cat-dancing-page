name: 🔍 PR Preview & Quality Check

on:
  pull_request:
    branches: [ main ]

jobs:
  pr-quality-check:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout PR code
      uses: actions/checkout@v4

    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🔍 Code quality checks
      run: |
        echo "🔍 Running code quality checks..."

        # Lint check
        if npm run lint --if-present; then
          echo "✅ Lint check passed"
        else
          echo "❌ Lint check failed"
          exit 1
        fi

    - name: 🏗️ Build verification
      run: |
        echo "🏗️ Building PR code..."
        npm run build

        echo "📊 Build output analysis:"
        ls -la dist/
        du -sh dist/

        # Check for critical files
        if [ ! -f "dist/index.html" ]; then
          echo "❌ Missing index.html in build output"
          exit 1
        fi

        if [ ! -d "dist/assets" ]; then
          echo "❌ Missing assets directory in build output"
          exit 1
        fi

        echo "✅ Build verification passed"

    - name: 🧪 Component tests (if available)
      run: |
        if npm run test --if-present; then
          echo "✅ Tests passed"
        else
          echo "ℹ️ No tests found or tests failed"
        fi

    - name: 📝 PR Summary Comment
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');

          // Get build info
          const buildSize = fs.existsSync('dist') ?
            require('child_process').execSync('du -sh dist/', {encoding: 'utf8'}).trim() :
            'Build not found';

          const comment = `## 🔍 PR Quality Check Results

          ### ✅ Build Status: **SUCCESS**

          📊 **Build Information:**
          - Build size: \`${buildSize}\`
          - Node.js version: 18.x
          - Build tool: Vite

          🧪 **Quality Checks:**
          - ✅ Code linting
          - ✅ Build compilation
          - ✅ Asset generation

          🚀 **Deployment Preview:**
          This PR can be safely merged and will trigger automatic deployment to:
          \`https://web-cat-dancing-page-mbu6gsnrf9f78176.sel4.cloudtype.app/\`

          ---
          *Quality check completed by GitHub Actions*`;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });